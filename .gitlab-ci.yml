# Preuve continue : chaque poussée rejoue les tests du domaine, et une fois par
# jour l'installation complète sous Linux depuis une image nue.
stages: [tests, installation]

# Le projet voit huit exécuteurs : quatre « docker », quatre « shell ». Sans
# étiquette, un job part au hasard, et sur un exécuteur shell la directive
# « image » est purement ignorée : « pip: command not found », exit 127. La
# même révision passait ou échouait selon l'exécuteur qui la ramassait.
default:
  tags: [docker]

# Les tests du domaine ne chargent aucun modèle et ne touchent à aucun fichier
# audio : ils tournent en moins d'une seconde, sur n'importe quel exécuteur.
tests:
  stage: tests
  image: python:3.13-slim
  script:
    - pip install -q -e ".[dev]"
    - python -m pytest tests/ -v --cov=greffier --cov-report=term --cov-report=xml
    # Les tests d'intégration doivent s'ignorer proprement là où les modèles
    # sont absents, et non échouer : aucun exécuteur n'a 1,7 Go de modèles.
    - python -m pytest -m integration -v
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Bloquant, et non « toléré » : une remarque de qualité laissée passer finit
# par masquer une vraie régression — c'est arrivé, un import supprimé par
# mégarde n'avait été rattrapé que par ruff en local.
qualite:
  stage: tests
  image: python:3.13-slim
  script:
    - pip install -q -e ".[dev]"
    - ruff check src tests outils
    - mypy

# Installation de bout en bout sur Linux, sans rien de préinstallé : c'est la
# preuve qu'un poste Linux vierge peut installer Greffier. Coûteuse (modèles à
# télécharger), donc réservée aux exécutions planifiées et aux étiquettes.
installation-linux:
  stage: installation
  image: docker:27
  services: [docker:27-dind]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - mkdir -p contexte && cp -r . contexte/greffier
    - docker build -f outils/preuve-linux.Dockerfile -t greffier-preuve contexte
