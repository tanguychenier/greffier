[project]
name = "greffier"
version = "0.3.25"
description = "Enregistre une réunion, identifie qui parle, en rédige le compte rendu, sans rien envoyer ailleurs."
readme = "README.md"
requires-python = ">=3.13"
# PEP 639: an SPDX expression and the file it stands for, which hatchling 1.27
# and newer write as License-Expression and License-File. The « License :: »
# classifier is deprecated by the same PEP, hence none below.
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENCE"]
authors = [{ name = "Tanguy Chenier" }]
keywords = [
    "réunion", "compte rendu", "transcription", "diarisation", "meeting",
    "minutes", "speaker diarization", "whisper", "sherpa-onnx", "offline",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    # Measured on 2026-10-03 with Python 3.14.8: every dependency has a wheel,
    # sherpa-onnx included, and the suite passes, 2 752 tests, 81 % covered.
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9",          # modèles et validation, plutôt qu'un parsing maison
    "pydantic-settings>=2.6", # configuration TOML + variables d'environnement
    "typer>=0.15",            # interface en ligne de commande
    "numpy>=2.0",             # empreintes vocales
    "soundfile>=0.13",        # lecture des enregistrements
    "sherpa-onnx>=1.13",      # segmentation et empreintes, en local
    "rapidfuzz>=3.10",        # distances d'édition, plutôt que deux à la main
]

[project.optional-dependencies]
# Transcription portable : whisper.cpp n'est empaqueté que sur macOS, où il est
# nettement plus rapide (Metal). Ailleurs, faster-whisper fait le même travail
# depuis Python, sur les trois systèmes.
transcription = ["faster-whisper>=1.1"]
# Accélération par carte NVIDIA. CTranslate2 et onnxruntime réclament ces
# bibliothèques, qu'aucune distribution n'installe avec le pilote : sans elles
# la carte est là et reste inutilisable. Mesuré : la transcription se traîne à
# treize fois le temps réel, soit treize heures pour une réunion d'une heure, et
# le découpage en tours de parole met 43 s là où la carte met 5,8 s. Deux
# gigaoctets de roues, d'où l'extra plutôt que la dépendance.
cuda = ["nvidia-cublas-cu12>=12.4", "nvidia-cudnn-cu12>=9.1",
        "nvidia-cuda-runtime-cu12>=12.4", "nvidia-cufft-cu12>=11.2",
        "nvidia-curand-cu12>=10.3"]
# La porte HTTP, pour un site qui pilote l'outil. Optionnelle : une installation
# de bureau n'a rien à écouter, et fastapi tire uvicorn et starlette avec lui.
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
# Lecture des corpus publics par `tools/fetch_corpus.py` : SUMM-RE est servi en
# parquet sur Hugging Face. Un outil de mesure, jamais le logiciel installé.
corpus = ["pyarrow>=17", "huggingface_hub>=0.25"]

[project.urls]
Homepage = "https://github.com/tanguychenier/greffier"
Repository = "https://github.com/tanguychenier/greffier"
Changelog = "https://github.com/tanguychenier/greffier/blob/main/CHANGELOG.md"
Issues = "https://github.com/tanguychenier/greffier/issues"

[project.scripts]
greffier = "greffier.cli:application"

# PEP 735: what a developer needs on top of the package, and never ships with
# it. `uv sync --group dev --extra api` installs it, `uv run <tool>` uses it.
[dependency-groups]
dev = [
    # The HTTP door's dependencies, for mypy as much as for the tests: it
    # follows the fastapi and uvicorn imports and fails on one it cannot find.
    # Named through the extra rather than copied, so the two lists cannot drift.
    "greffier[api]",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "mutmut>=3.2",
    "httpx>=0.27",   # the test client behind fastapi's TestClient
]

[build-system]
# 1.27 is the first hatchling to read the PEP 639 fields above.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greffier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deux familles exclues par défaut, pour deux raisons différentes.
#
# « integration » charge les modèles et transcrit réellement : des minutes,
# contre quelques millisecondes pour le reste. « pytest -m integration ».
#
# « lent » appelle le vrai rédacteur, donc le réseau et le quota du compte.
# Ces cas-là mesurent ce qu'aucune doublure ne peut mesurer, qu'un modèle se
# taise quand il n'a rien à dire, et se passent à la main avant une
# démonstration. « pytest -m lent ».
#
# `--strict-markers`: a misspelt marker is an error, where by default it is a
# test that silently stops being selected. `--strict-config`: the same for a
# misspelt key in this section. `xfail_strict`: a test expected to fail that
# passes is reported, instead of being forgotten under its xfail.
addopts = "-q -m 'not integration and not lent' --strict-markers --strict-config"
xfail_strict = true
markers = [
    "integration: chaîne réelle, avec les modèles et un fichier audio synthétisé",
    "lent: appelle le rédacteur, donc le réseau et le quota",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer déclare les options dans les valeurs par défaut : c'est sa signature,
# pas une négligence.
"src/greffier/cli.py" = ["B008"]
# L'installeur doit tourner sur Python 3.9, celui encore livré par défaut sur
# beaucoup de postes, alors que le paquet, lui, exige 3.13. Ses gardes de
# version ne sont donc pas obsolètes.
"tools/install.py" = ["UP036"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/greffier"]

# L'exception qui relâchait la rigueur sur les adaptateurs visait
# « greffier.adaptateurs.* », un dossier renommé « adapters » depuis, donc une
# exception qui ne s'appliquait plus à rien. Retirée plutôt que réparée : le
# code la traverse en strict sans une ligne de changement, et une exception qui
# ne protège rien ne fait qu'induire en erreur qui la lit.

[[tool.mypy.overrides]]
# Bibliothèques sans annotations, ou absentes tant que l'extra n'est pas
# installé : huggingface_hub arrive avec faster-whisper, et la vérification de
# types tourne, elle, sans les extras.
module = [
    "sherpa_onnx.*", "soundfile.*", "faster_whisper.*", "huggingface_hub.*",
    "pyarrow.*",
]
ignore_missing_imports = true

# Les tests de mutation. CONTRIBUTING les demandait sans que l'outil soit
# installé ni réglé : la consigne promettait une vérification qui n'existait
# pas. Seul le domaine est muté, parce que lui seul se teste en millisecondes.
[tool.mutmut]
source_paths = ["src/greffier/domain/"]
pytest_add_cli_args_test_selection = ["tests/domain/"]
# mutmut copies the mutated tree into mutants/ and takes the original src/ off
# sys.path, so the rest of the package has to travel with the domain or the
# tests cannot import greffier at all. tests/, pyproject.toml and uv.lock are
# copied without being asked (mutmut 3.8, configuration.py).
also_copy = ["src/"]
