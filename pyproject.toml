[project]
name = "greffier"
version = "0.3.21"
description = "Enregistre une réunion, identifie qui parle, en rédige le compte rendu, sans rien envoyer ailleurs."
requires-python = ">=3.13"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
    "pydantic>=2.9",          # modèles et validation, plutôt qu'un parsing maison
    "pydantic-settings>=2.6", # configuration TOML + variables d'environnement
    "typer>=0.15",            # interface en ligne de commande
    "numpy>=2.0",             # empreintes vocales
    "soundfile>=0.13",        # lecture des enregistrements
    "sherpa-onnx>=1.13",      # segmentation et empreintes, en local
    "rapidfuzz>=3.10",        # distances d'édition, plutôt que deux à la main
]

[project.optional-dependencies]
# Transcription portable : whisper.cpp n'est empaqueté que sur macOS, où il est
# nettement plus rapide (Metal). Ailleurs, faster-whisper fait le même travail
# depuis Python, sur les trois systèmes.
transcription = ["faster-whisper>=1.1"]
# Accélération par carte NVIDIA. CTranslate2 et onnxruntime réclament ces
# bibliothèques, qu'aucune distribution n'installe avec le pilote : sans elles
# la carte est là et reste inutilisable. Mesuré : la transcription se traîne à
# treize fois le temps réel, soit treize heures pour une réunion d'une heure, et
# le découpage en tours de parole met 43 s là où la carte met 5,8 s. Deux
# gigaoctets de roues, d'où l'extra plutôt que la dépendance.
cuda = ["nvidia-cublas-cu12>=12.4", "nvidia-cudnn-cu12>=9.1",
        "nvidia-cuda-runtime-cu12>=12.4", "nvidia-cufft-cu12>=11.2",
        "nvidia-curand-cu12>=10.3"]
# Icône de zone de notification pour Linux et Windows. macOS a son app native :
# La porte HTTP, pour un site qui pilote l'outil. Optionnelle : une installation
# de bureau n'a rien à écouter, et fastapi tire uvicorn et starlette avec lui.
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
# uvicorn est là pour mypy autant que pour l'usage : sans lui, la vérification
# de types échoue sur un import qu'elle ne peut pas suivre.
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "mypy>=1.13",
       "fastapi>=0.115", "httpx>=0.27", "python-multipart>=0.0.9",
       "uvicorn>=0.30"]

[project.scripts]
greffier = "greffier.cli:application"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greffier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deux familles exclues par défaut, pour deux raisons différentes.
#
# « integration » charge les modèles et transcrit réellement : des minutes,
# contre quelques millisecondes pour le reste. « pytest -m integration ».
#
# « lent » appelle le vrai rédacteur, donc le réseau et le quota du compte.
# Ces cas-là mesurent ce qu'aucune doublure ne peut mesurer, qu'un modèle se
# taise quand il n'a rien à dire, et se passent à la main avant une
# démonstration. « pytest -m lent ».
addopts = "-q -m 'not integration and not lent'"
markers = [
    "integration: chaîne réelle, avec les modèles et un fichier audio synthétisé",
    "lent: appelle le rédacteur, donc le réseau et le quota",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer déclare les options dans les valeurs par défaut : c'est sa signature,
# pas une négligence.
"src/greffier/cli.py" = ["B008"]
# L'installeur doit tourner sur Python 3.9, celui encore livré par défaut sur
# beaucoup de postes, alors que le paquet, lui, exige 3.13. Ses gardes de
# version ne sont donc pas obsolètes.
"tools/install.py" = ["UP036"]
"src/greffier/adaptateurs/configuration.py" = ["UP036"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/greffier"]

# L'exception qui relâchait la rigueur sur les adaptateurs visait
# « greffier.adaptateurs.* », un dossier renommé « adapters » depuis, donc une
# exception qui ne s'appliquait plus à rien. Retirée plutôt que réparée : le
# code la traverse en strict sans une ligne de changement, et une exception qui
# ne protège rien ne fait qu'induire en erreur qui la lit.

[[tool.mypy.overrides]]
# Bibliothèques sans annotations, ou absentes tant que l'extra n'est pas
# installé : huggingface_hub arrive avec faster-whisper, et la vérification de
# types tourne, elle, sans les extras.
module = [
    "sherpa_onnx.*", "soundfile.*", "faster_whisper.*", "huggingface_hub.*",
]
ignore_missing_imports = true
