# Ce que Greffier dit, en français. Une langue de plus = un fichier de plus,
# avec les mêmes clés. Ce qui manque retombe sur l'anglais.
#
# Deux règles de ton, tenues partout : on vouvoie, et on nomme les choses comme
# la personne les nomme. « Attendus » et « À soulever » étaient des étiquettes
# de développeur ; personne ne sait ce qu'elles demandent.

