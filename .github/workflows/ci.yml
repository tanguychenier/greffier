# Preuve continue, ici et non ailleurs : le dépôt portait un « .gitlab-ci.yml »
# de son hébergement précédent, et le README annonçait une intégration continue
# qui ne tournait nulle part.
#
# Un seul job plutôt que trois : les trois contrôles durent quelques secondes
# chacun, et trois jobs paieraient trois démarrages de machine pour le même
# résultat. L'étape qui échoue se voit dans le journal.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controles:
    name: ruff, mypy et les tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Dépendances
        run: pip install -q -e ".[dev]"

      # Bloquant, et non « toléré » : une remarque de qualité laissée passer
      # finit par masquer une vraie régression.
      - name: ruff
        run: ruff check src tests outils

      - name: mypy
        run: mypy

      - name: Tests
        run: python -m pytest tests/ -v --cov=greffier --cov-report=term

      # Les tests d'intégration doivent s'ignorer proprement là où les modèles
      # sont absents, et non échouer : aucun exécuteur n'a 1,7 Go de modèles.
      - name: Les tests d'intégration s'ignorent sans modèles
        run: python -m pytest -m integration -v

  installation-linux:
    name: Installation sur une image nue
    # Coûteuse — elle télécharge les modèles — donc jamais automatique.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preuve d'installation
        run: |
          mkdir -p contexte && cp -r . contexte/greffier
          docker build -f outils/preuve-linux.Dockerfile -t greffier-preuve contexte
