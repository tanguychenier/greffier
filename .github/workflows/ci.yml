# One job rather than three: the three checks take a few seconds each, and three
# jobs would pay for three machine startups for the same result. Whichever step
# fails shows up in the log.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ruff, mypy and the tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Dependencies
        run: pip install -q -e ".[dev]"

      # Blocking, not "tolerated": a quality remark let through ends up hiding a
      # real regression.
      - name: ruff
        run: ruff check src tests tools

      - name: mypy
        run: mypy

      - name: Tests
        run: python -m pytest tests/ -v --cov=greffier --cov-report=term

      # The integration tests must skip cleanly where the models are absent
      # rather than fail: no runner carries 1.7 GB of models.
      - name: Integration tests skip without models
        run: python -m pytest -m integration -v

  linux-install:
    name: Install on a bare image
    # Expensive, it downloads the models, so never automatic.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Proof of installation
        run: |
          mkdir -p contexte && cp -r . contexte/greffier
          docker build -f tools/install-proof-linux.Dockerfile -t greffier-preuve contexte
