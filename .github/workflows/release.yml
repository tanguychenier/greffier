# Builds one artefact per system and attaches it to the release.
#
# The point is the double click: someone who does not write code downloads a
# file, opens it, and the tool installs itself. That the installer then fetches
# models is expected: 1.7 GB of whisper and a voice do not travel as an
# attachment.
#
# What each artefact is, and what it is not:
#
# - **macOS**: the .app bundle `construire.sh` already produces, interpreter and
#   dependencies included. Signed **ad hoc** here, for want of the development
#   machine's certificate: Gatekeeper will refuse it on first launch, and it
#   takes a right click then "Open". Solving that needs a Developer ID and
#   notarisation, so a paid account and a decision nobody has taken.
#   Built twice, once per processor: the interpreter and every compiled wheel
#   are copied in as they are, so a bundle runs only on the processor it was
#   built on. Up to 0.3.32 only the Apple Silicon one existed, and an Intel Mac
#   answered « bad CPU type in executable ». The Apple Silicon archive keeps
#   its historical name: the bundles already installed look for it by name to
#   update themselves.
# - **Windows**: a folder with an .exe, by PyInstaller. Never run on a real
#   Windows machine as these lines are written: what this workflow proves is
#   that it builds and that it starts on the runner.
# - **Linux**: the source tree and its installer, and an AppImage: one file
#   to download, mark executable and double-click, built by
#   `tools/build_appimage.py` and run on `--version` on the runner.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      meeting_proof:
        description: Verify the published macOS package on a synthetic meeting
        type: boolean
        default: false
      whisper_diagnostic:
        description: Diagnose native whisper.cpp before the meeting check
        type: boolean
        default: false
      release_tag:
        description: Published package to verify
        type: string
        default: v0.3.34

permissions:
  contents: write

jobs:
  macos:
    if: ${{ !inputs.meeting_proof }}
    name: macOS bundle (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Homebrew no longer bottles every Intel formula: on an Intel Mac x265 was
    # compiled from source, more than thirty minutes on its own.
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            archive: Greffier-macos.zip
            minutes: 45
          - runner: macos-15-intel
            arch: x86_64
            archive: Greffier-macos-intel.zip
            minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Native audio tools
        run: brew install ffmpeg whisper-cpp
      - name: Relocatable interpreter
        # `only-managed` is the heart of the matter, not a precaution.
        # `construire.sh` copies the .venv interpreter into the bundle, which
        # only works with a uv Python (python-build-standalone). Without the
        # flag, uv picks the **framework** Python already on the runner, whose
        # prefix is hard-coded, and the bundle then imports `greffier` from
        # /Library/Frameworks instead of from itself.
        run: |
          uv venv --python 3.13 --python-preference only-managed
          .venv/bin/python3 -c "import sys; print('interpreter:', sys.base_prefix)"
      - name: Build the bundle
        # The target is given explicitly: with no argument the script picks
        # /Applications or ~/Applications, and the next step would not know
        # where to look.
        #
        # Ad hoc on purpose: there is no certificate on a runner, and asking
        # the keychain to trust one opens a password window nobody can answer.
        env:
          GREFFIER_SIGNATURE: '-'
        run: bash macos/construire.sh "$RUNNER_TEMP/Greffier.app"
      - name: Every binary in the bundle runs on ${{ matrix.arch }}
        # Running the bundle on its own runner proves nothing about the other
        # processor: that is how an arm64-only package was published as « the
        # macOS bundle ».
        env:
          ARCH: ${{ matrix.arch }}
        run: .venv/bin/python tools/check_bundle_architecture.py "$RUNNER_TEMP/Greffier.app" --arch "$ARCH"
      - name: Every script in the bundle runs through an interpreter every Mac has
        # The bundle is built in a temporary workshop: up to 0.3.33 every
        # launcher in Contents/bin named it on its first line and answered
        # « bad interpreter » on every Mac.
        run: .venv/bin/python tools/check_bundle_scripts.py "$RUNNER_TEMP/Greffier.app"
      - name: Open every tab in the native bundle
        run: >-
          .venv/bin/python tools/check_runtime.py --output runtime-macos.json --
          "$RUNNER_TEMP/Greffier.app/Contents/MacOS/Greffier"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-macos-${{ matrix.arch }}
          path: runtime-macos.json
      - name: Process a reference meeting in the native bundle
        run: |
          meeting_version="$("$RUNNER_TEMP/Greffier.app/Contents/MacOS/Greffier" -c 'import importlib.metadata; print(importlib.metadata.version("greffier"))')"
          "$RUNNER_TEMP/Greffier.app/Contents/MacOS/Greffier" tools/check_packaged_meeting.py \
            --output "$RUNNER_TEMP/meeting-proof" --version "$meeting_version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: meeting-macos-release-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/meeting-proof/meeting-proof.json
            ${{ runner.temp }}/meeting-proof/synthetic-meeting.wav
            ${{ runner.temp }}/meeting-proof/synthetic-meeting.timeline.json
            ${{ runner.temp }}/meeting-proof/pipeline.log
            ${{ runner.temp }}/meeting-proof/data/transcriptions/*.txt
      - name: Zip it
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          cd "$RUNNER_TEMP"
          ditto -c -k --sequesterRsrc --keepParent Greffier.app \
            "$GITHUB_WORKSPACE/$ARCHIVE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Greffier-macos-${{ matrix.arch }}
          path: ${{ matrix.archive }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/attach-to-release
        with:
          file: ${{ matrix.archive }}
          token: ${{ github.token }}

  windows:
    if: ${{ !inputs.meeting_proof }}
    name: Windows executable
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Dependencies
        run: |
          python -m pip install -q -e ".[transcription]"
          python -m pip install -q pyinstaller
      - name: Build
        # `--collect-all sherpa_onnx` because its native libraries are not
        # Python modules: PyInstaller does not see them on its own. And
        # `--collect-data greffier` for the sentences and the sounds: without
        # it the window opened on the runner showed `modeles.manquants` in
        # place of its first question.
        run: |
          pyinstaller --noconfirm --name Greffier --windowed `
            --collect-all sherpa_onnx --collect-all soundfile `
            --collect-submodules greffier --collect-data greffier `
            --collect-data faster_whisper `
            tools/launcher.py
      - name: It starts
        # A `--windowed` executable detaches from the terminal and returns at
        # once, so calling it directly reports its launcher's exit code and
        # never its own. It has to be waited for to be read.
        run: |
          $p = Start-Process -FilePath dist\Greffier\Greffier.exe `
            -ArgumentList '--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "Greffier.exe --version returned $($p.ExitCode)"
          }
      - name: Decode audio in the native executable
        run: |
          $p = Start-Process -FilePath dist\Greffier\Greffier.exe `
            -ArgumentList '--check-audio' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "Greffier.exe --check-audio returned $($p.ExitCode)"
          }
      - name: Open every tab in the native executable
        run: >-
          python tools/check_runtime.py --output runtime-windows.json --
          dist/Greffier/Greffier.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-windows
          path: runtime-windows.json
      - name: Process a reference meeting in the native executable
        run: |
          choco install ffmpeg --yes --no-progress
          python tools/check_frozen_meeting.py --application dist/Greffier/Greffier.exe `
            --runtime-report runtime-windows.json --output "$env:RUNNER_TEMP/meeting-proof"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: meeting-windows-release
          path: |
            ${{ runner.temp }}/meeting-proof/meeting-proof.json
            ${{ runner.temp }}/meeting-proof/synthetic-meeting.wav
            ${{ runner.temp }}/meeting-proof/synthetic-meeting.timeline.json
            ${{ runner.temp }}/meeting-proof/*.log
            ${{ runner.temp }}/meeting-proof/data/transcriptions/*.txt
      - name: Zip it
        run: Compress-Archive -Path dist\Greffier -DestinationPath Greffier-windows.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Greffier-windows
          path: Greffier-windows.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/attach-to-release
        with:
          file: Greffier-windows.zip
          token: ${{ github.token }}

  linux:
    if: ${{ !inputs.meeting_proof }}
    name: Linux archive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Archive the sources and their installer
        run: |
          git archive --format=tar.gz --prefix=greffier/ -o Greffier-linux.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Greffier-linux
          path: Greffier-linux.tar.gz
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/attach-to-release
        with:
          file: Greffier-linux.tar.gz
          token: ${{ github.token }}

  appimage:
    if: ${{ !inputs.meeting_proof }}
    name: Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libfuse2 python3-tk xvfb
          python -m pip install -q -e ".[transcription]"
          python -m pip install -q pyinstaller
      - name: Build, then run it on --version
        # The same PyInstaller command as the Windows executable, wrapped by
        # appimagetool; `--check` runs the result, the only check a runner
        # without a screen allows. Opened on a virtual screen on 2026-09-16.
        run: python3 tools/build_appimage.py --check
      - name: Decode audio in the AppImage
        run: APPIMAGE_EXTRACT_AND_RUN=1 dist/Greffier-x86_64.AppImage --check-audio
      - name: Open every tab in the AppImage
        run: >-
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a python3 tools/check_runtime.py
          --output runtime-linux.json -- dist/Greffier-x86_64.AppImage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-linux
          path: runtime-linux.json
      - name: Process a reference meeting in the AppImage
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          APPIMAGE_EXTRACT_AND_RUN=1 python3 tools/check_frozen_meeting.py \
            --application dist/Greffier-x86_64.AppImage --runtime-report runtime-linux.json \
            --output "$RUNNER_TEMP/meeting-proof"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: meeting-linux-release
          path: |
            ${{ runner.temp }}/meeting-proof/meeting-proof.json
            ${{ runner.temp }}/meeting-proof/synthetic-meeting.wav
            ${{ runner.temp }}/meeting-proof/synthetic-meeting.timeline.json
            ${{ runner.temp }}/meeting-proof/*.log
            ${{ runner.temp }}/meeting-proof/data/transcriptions/*.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Greffier-appimage
          path: dist/Greffier-x86_64.AppImage
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/attach-to-release
        with:
          file: dist/Greffier-x86_64.AppImage
          token: ${{ github.token }}

  macos_meeting:
    name: Published macOS meeting pipeline (${{ matrix.arch }})
    if: ${{ inputs.meeting_proof }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            archive: Greffier-macos.zip
          - runner: macos-15-intel
            arch: x86_64
            archive: Greffier-macos-intel.zip
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Audio tools
        run: brew install ffmpeg whisper-cpp
      - name: Download and verify the published package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          gh release download "$RELEASE_TAG" --pattern "$ARCHIVE" --dir "$RUNNER_TEMP/package"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/package/release.json"
          python3 - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          folder = Path(os.environ["RUNNER_TEMP"]) / "package"
          release = json.loads((folder / "release.json").read_text(encoding="utf-8"))
          assert not release["draft"] and not release["prerelease"]
          asset = next(a for a in release["assets"] if a["name"] == os.environ["ARCHIVE"])
          archive = folder / asset["name"]
          assert archive.stat().st_size == asset["size"]
          with archive.open("rb") as stream:
              assert "sha256:" + hashlib.file_digest(stream, "sha256").hexdigest() == asset["digest"]
          print("Published package SHA256 verified.")
          PYTHON
          ditto -x -k "$RUNNER_TEMP/package/$ARCHIVE" "$RUNNER_TEMP/package"
      - name: Transcribe and attribute the reference dialogue
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          WHISPER_DIAGNOSTIC: ${{ inputs.whisper_diagnostic }}
        run: |
          meeting_command=("$RUNNER_TEMP/package/Greffier.app/Contents/MacOS/Greffier"
            tools/check_packaged_meeting.py --output "$RUNNER_TEMP/meeting-proof"
            --version "${RELEASE_TAG#v}")
          if [ "$WHISPER_DIAGNOSTIC" = true ]; then
            meeting_command+=(--diagnose-whisper)
          fi
          "${meeting_command[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: meeting-macos-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/meeting-proof/meeting-proof.json
            ${{ runner.temp }}/meeting-proof/synthetic-meeting.wav
            ${{ runner.temp }}/meeting-proof/synthetic-meeting.timeline.json
            ${{ runner.temp }}/meeting-proof/*.log
            ${{ runner.temp }}/meeting-proof/whisper-diagnostic.json
            ${{ runner.temp }}/meeting-proof/*.srt
            ${{ runner.temp }}/meeting-proof/*.stack.txt
            ${{ runner.temp }}/meeting-proof/data/transcriptions/*.txt
