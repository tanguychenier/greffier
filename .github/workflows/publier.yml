# Fabrique un artefact par système et l'attache à la publication.
#
# Le but est le double-clic : quelqu'un qui n'écrit pas de code télécharge un
# fichier, l'ouvre, et l'outil s'installe. Que cet installeur télécharge ensuite
# des modèles est normal et attendu — 1,7 Go de whisper et la voix ne se glissent
# pas dans une pièce jointe.
#
# Ce que chaque artefact est, et ce qu'il n'est pas :
#
# - **macOS** : le paquet .app que `construire.sh` produit déjà, avec son
#   interpréteur et ses dépendances. Signé **ad hoc** ici, faute du certificat du
#   poste de développement : Gatekeeper le refusera au premier lancement, et il
#   faudra un clic droit puis « Ouvrir ». Le résoudre demande un Developer ID et
#   une notarisation, donc un compte payant et une décision qui n'est pas prise.
# - **Windows** : un dossier avec un .exe, par PyInstaller. Jamais lancé sur une
#   vraie machine Windows au moment d'écrire ces lignes : ce que prouve ce
#   workflow, c'est qu'il se construit et qu'il démarre sur l'exécuteur.
# - **Linux** : l'arbre des sources et son installeur. Un AppImage serait plus
#   commode, et reste à faire.
name: Publier

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: Paquet macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Interpréteur relogeable
        # `only-managed` est le fond de l'affaire, pas une précaution.
        # `construire.sh` copie l'interpréteur du .venv dans le paquet, ce qui
        # n'est possible qu'avec un Python d'uv (python-build-standalone). Sans
        # ce drapeau, uv prend le Python **framework** déjà présent sur
        # l'exécuteur : un framework garde son préfixe en dur, donc le paquet
        # construit importait « greffier » depuis
        # /Library/Frameworks/… et non depuis lui-même, avec des dépendances
        # réparties entre les deux — d'où un « libonnxruntime.dylib » absent du
        # paquet alors qu'il était bien installé.
        #
        # Le .venv n'a pas besoin des dépendances : le script les installe
        # lui-même dans le paquet.
        run: |
          uv venv --python 3.13 --python-preference only-managed
          .venv/bin/python3 -c "import sys; print('interpréteur :', sys.base_prefix)"
      - name: Construire le paquet
        # La cible est donnée explicitement : sans argument, le script choisit
        # /Applications ou ~/Applications selon ce qui est accessible en
        # écriture, et l'étape suivante ne saurait pas où chercher.
        #
        # Sans identité de signature sur l'exécuteur, `identite-de-signature.sh`
        # retombe sur la signature ad hoc, ce qui suffit à produire un paquet
        # lançable — et non à satisfaire Gatekeeper.
        run: bash macos/construire.sh "$RUNNER_TEMP/Greffier.app"
      - name: Archiver
        run: |
          cd "$RUNNER_TEMP"
          ditto -c -k --sequesterRsrc --keepParent Greffier.app \
            "$GITHUB_WORKSPACE/Greffier-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Greffier-macos
          path: Greffier-macos.zip
      - name: Attacher à la publication
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Chaque système attache le sien dès qu'il est prêt, plutôt que
          # d'attendre les deux autres : sur la première publication, macOS a
          # mis cinquante minutes et rien n'était téléchargeable pendant ce
          # temps. La publication est créée par le premier arrivé.
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --repo "${GITHUB_REPOSITORY}" \
                 --title "Greffier ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" Greffier-macos.zip \
            --repo "${GITHUB_REPOSITORY}" --clobber


  windows:
    name: Exécutable Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dépendances
        run: |
          python -m pip install -q -e ".[transcription]"
          python -m pip install -q pyinstaller
      - name: Construire
        # `--collect-all sherpa_onnx` parce que ses bibliothèques natives ne
        # sont pas des modules Python : PyInstaller ne les voit pas tout seul.
        run: |
          pyinstaller --noconfirm --name Greffier --windowed `
            --collect-all sherpa_onnx --collect-all soundfile `
            --collect-submodules greffier `
            outils/lanceur_windows.py
      - name: Il démarre
        # Le seul contrôle possible ici : l'exécutable se lance et rend la main.
        # Une fenêtre ne s'ouvre pas sur un exécuteur sans session graphique.
        #
        # Par `Start-Process -Wait`, et c'est ce qui rend le contrôle réel : un
        # exécutable construit en `--windowed` se détache du terminal et rend la
        # main immédiatement, donc l'appeler directement rapporte le code de son
        # lanceur, jamais le sien. Il faut l'attendre pour le lire.
        run: |
          $p = Start-Process -FilePath dist\Greffier\Greffier.exe `
            -ArgumentList '--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "Greffier.exe --version a rendu $($p.ExitCode)"
          }
      - name: Archiver
        run: Compress-Archive -Path dist\Greffier -DestinationPath Greffier-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Greffier-windows
          path: Greffier-windows.zip
      - name: Attacher à la publication
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Chaque système attache le sien dès qu'il est prêt, plutôt que
          # d'attendre les deux autres : sur la première publication, macOS a
          # mis cinquante minutes et rien n'était téléchargeable pendant ce
          # temps. La publication est créée par le premier arrivé.
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --repo "${GITHUB_REPOSITORY}" \
                 --title "Greffier ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" Greffier-windows.zip \
            --repo "${GITHUB_REPOSITORY}" --clobber


  linux:
    name: Archive Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archiver les sources et leur installeur
        run: |
          git archive --format=tar.gz --prefix=greffier/ -o Greffier-linux.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Greffier-linux
          path: Greffier-linux.tar.gz
      - name: Attacher à la publication
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Chaque système attache le sien dès qu'il est prêt, plutôt que
          # d'attendre les deux autres : sur la première publication, macOS a
          # mis cinquante minutes et rien n'était téléchargeable pendant ce
          # temps. La publication est créée par le premier arrivé.
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --repo "${GITHUB_REPOSITORY}" \
                 --title "Greffier ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" Greffier-linux.tar.gz \
            --repo "${GITHUB_REPOSITORY}" --clobber
