<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340"
     role="img" aria-labelledby="title desc">
  <title id="title">How Greffier works, from the room to the minutes</title>
  <desc id="desc">Two audio channels are captured, transcribed, cut into
  speaking turns and matched against a voice bank. Names spoken during the
  meeting are crossed with the voice prints. The assistant answers when called
  by its first name. Everything runs on the machine except, optionally, the
  writing of the minutes.</desc>

  <style>
    .ground { fill: #0f1115; }
    .card   { fill: #171a21; stroke: #262b36; stroke-width: 1; }
    .local  { stroke: #2f6f4f; }
    .out    { stroke: #6b5330; stroke-dasharray: 4 3; }
    .title  { fill: #e8eaed; font: 600 13px ui-sans-serif, system-ui, sans-serif; }
    .sub    { fill: #9aa2ae; font: 400 10.5px ui-sans-serif, system-ui, sans-serif; }
    .step   { fill: #5c6675; font: 600 9px ui-sans-serif, system-ui, sans-serif;
              letter-spacing: .08em; }
    .rule   { stroke: #2a303c; stroke-width: 1.5; fill: none; }
    .flow   { stroke: #4ea87a; stroke-width: 2; fill: none; stroke-linecap: round; }
    .voice  { stroke: #d4a24c; stroke-width: 2; fill: none; stroke-linecap: round; }
    .legend { fill: #6b7480; font: 400 10px ui-sans-serif, system-ui, sans-serif; }
    .badge  { fill: #1d2530; stroke: #2f3a49; stroke-width: 1; }
    .badget { fill: #7f8b9a; font: 600 9px ui-sans-serif, system-ui, sans-serif; }

    /* The flow: a line that fills, then starts over. One animation per segment,
       offset, so the eye follows the direction of the chain. */
    .dash { stroke-dasharray: 90; stroke-dashoffset: 90;
            animation: pull 7s linear infinite; }
    @keyframes pull {
      0%   { stroke-dashoffset: 90; }
      18%  { stroke-dashoffset: 0; }
      92%  { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    .s1 { animation-delay: 0s; }
    .s2 { animation-delay: .55s; }
    .s3 { animation-delay: 1.1s; }
    .s4 { animation-delay: 1.65s; }
    .s5 { animation-delay: 2.2s; }

    /* The cards light up in turn. */
    .lit { animation: light-up 7s linear infinite; }
    @keyframes light-up {
      0%, 8%    { stroke: #262b36; }
      12%, 88%  { stroke: #3c4657; }
      100%      { stroke: #262b36; }
    }
    .c1 { animation-delay: 0s; }
    .c2 { animation-delay: .55s; }
    .c3 { animation-delay: 1.1s; }
    .c4 { animation-delay: 1.65s; }
    .c5 { animation-delay: 2.2s; }

    /* The two channels pulse at the start: that is where everything begins. */
    .pulse { animation: battre 2.4s ease-in-out infinite; transform-origin: center; }
    @keyframes beat { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    .p2 { animation-delay: .5s; }

    @media (prefers-reduced-motion: reduce) {
      .dash, .lit, .pulse { animation: none; stroke-dashoffset: 0; }
    }
  </style>

  <rect class="ground" width="900" height="340" rx="10"/>

  <!-- Les deux canaux -->
  <g transform="translate(24,96)">
    <rect class="card local lit c1" width="132" height="76" rx="8"/>
    <text class="step" x="14" y="20">1 · CAPTURE</text>
    <text class="title" x="14" y="40">Two channels</text>
    <text class="sub" x="14" y="56">your mic, left</text>
    <text class="sub" x="14" y="68">everyone else, right</text>
    <g class="pulse"><circle cx="112" cy="16" r="3.5" fill="#4ea87a"/></g>
    <g class="pulse p2"><circle cx="122" cy="16" r="3.5" fill="#4ea87a"/></g>
  </g>

  <!-- Transcription -->
  <g transform="translate(196,96)">
    <rect class="card local lit c2" width="132" height="76" rx="8"/>
    <text class="step" x="14" y="20">2 · WORDS</text>
    <text class="title" x="14" y="40">whisper</text>
    <text class="sub" x="14" y="56">large-v3, on the card</text>
    <text class="sub" x="14" y="68">where there is one</text>
  </g>

  <!-- Voix -->
  <g transform="translate(368,96)">
    <rect class="card local lit c3" width="132" height="76" rx="8"/>
    <text class="step" x="14" y="20">3 · WHO</text>
    <text class="title" x="14" y="40">pyannote + TitaNet</text>
    <text class="sub" x="14" y="56">speaking turns, then</text>
    <text class="sub" x="14" y="68">a print per voice</text>
  </g>

  <!-- Noms -->
  <g transform="translate(540,96)">
    <rect class="card local lit c4" width="132" height="76" rx="8"/>
    <text class="step" x="14" y="20">4 · NAMES</text>
    <text class="title" x="14" y="40">Voice bank</text>
    <text class="sub" x="14" y="56">what the room says,</text>
    <text class="sub" x="14" y="68">crossed with prints</text>
  </g>

  <!-- Compte rendu -->
  <g transform="translate(712,96)">
    <rect class="card out lit c5" width="164" height="76" rx="8"/>
    <text class="step" x="14" y="20">5 · MINUTES</text>
    <text class="title" x="14" y="40">Decisions, actions</text>
    <text class="sub" x="14" y="56">the only step that may</text>
    <text class="sub" x="14" y="68">leave the machine</text>
  </g>

  <!-- The flow between the steps -->
  <path class="flow dash s1" d="M156 134 H196"/>
  <path class="flow dash s2" d="M328 134 H368"/>
  <path class="flow dash s3" d="M500 134 H540"/>
  <path class="flow dash s4" d="M672 134 H712"/>

  <!-- The assistant, below: it listens to everything and answers when called -->
  <g transform="translate(196,220)">
    <rect class="card voice" width="304" height="72" rx="8" fill="#151a1f"/>
    <text class="step" x="14" y="20" style="fill:#a8813f">CALLED BY NAME</text>
    <text class="title" x="14" y="40">The assistant answers out loud</text>
    <text class="sub" x="14" y="56">Kokoro or VITS, local, ~4 s, silent otherwise</text>
  </g>
  <path class="voice dash s5" d="M262 172 V220"/>
  <path class="voice dash s5" d="M434 172 V220"/>

  <!-- Fixing a name during the meeting -->
  <g transform="translate(540,220)">
    <rect class="card" width="336" height="72" rx="8"/>
    <text class="step" x="14" y="20">DURING THE MEETING</text>
    <text class="title" x="14" y="40">Click a name and it is fixed everywhere</text>
    <text class="sub" x="14" y="56">that voice, the bank, and the final minutes</text>
  </g>
  <path class="rule" d="M606 172 V220"/>

  <!-- Legend -->
  <g transform="translate(24,42)">
    <text class="title" x="0" y="0">From the room to the minutes</text>
    <text class="legend" x="0" y="18">Solid green: stays on the machine. Dashed amber: may leave, only if you ask.</text>
  </g>
  <g transform="translate(742,36)">
    <rect class="badge" width="134" height="22" rx="11"/>
    <text class="badget" x="14" y="15">LOCAL BY DEFAULT</text>
  </g>
</svg>
